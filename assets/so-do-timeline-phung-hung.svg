<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Phùng Hưng và khởi nghĩa Đường Lâm từ khoảng năm 766 đến năm 803">
<title>Phùng Hưng và khởi nghĩa Đường Lâm — dòng thời gian 766–803</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Phùng Hưng và khởi nghĩa Đường Lâm — dòng thời gian 766–803 (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="90" cy="120" r="10" fill="#a94442"/><text x="90" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Khoảng 766–780</text><text x="90" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Dấy binh ở Đường Lâm</text><text x="90" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xưng Đô Quân</text>
<circle cx="270" cy="120" r="10" fill="#a94442"/><text x="270" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Tháng 4 năm 791</text><text x="270" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vây phủ Tống Bình</text><text x="270" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Cao Chính Bình chết</text>
<circle cx="450" cy="120" r="10" fill="#a94442"/><text x="450" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 791</text><text x="450" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vào phủ trị, mất sau mấy tháng</text><text x="450" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo Toàn thư</text>
<circle cx="630" cy="120" r="10" fill="#8a6d3b"/><text x="630" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Khoảng 798 (dị bản)</text><text x="630" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thị sự bảy năm rồi mất</text><text x="630" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Việt điện u linh tập</text>
<circle cx="810" cy="120" r="10" fill="#333"/><text x="810" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">802–803 (dã sử)</text><text x="810" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mất 802; Phùng An hàng 803</text><text x="810" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Phùng An nối nghiệp</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Đại Việt sử ký toàn thư + Việt điện u linh tập + dã sử. Một số mốc các nguồn vênh nhau.</text>
</svg>
