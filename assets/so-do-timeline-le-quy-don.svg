<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian Lê Quý Đôn năm 1726 đến năm 2025">
<title>Dòng thời gian Lê Quý Đôn, 1726–2025</title>
<rect width="900" height="240" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Lê Quý Đôn — dòng thời gian 1726–2025 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="125" x2="840" y2="125" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="70" cy="125" r="10" fill="#a94442"/><text x="70" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1726</text><text x="70" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh ngày 2/8,</text><text x="70" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">làng Diên Hà</text><text x="70" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tên lúc nhỏ</text><text x="70" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Lê Danh Phương</text>
<circle cx="175" cy="125" r="10" fill="#a94442"/><text x="175" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1743</text><text x="175" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thi Hương đỗ</text><text x="175" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Giải nguyên</text>
<circle cx="280" cy="125" r="10" fill="#a94442"/><text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1752</text><text x="280" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đỗ Hội nguyên,</text><text x="280" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bảng nhãn</text><text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ba lần đỗ đầu</text>
<circle cx="385" cy="125" r="10" fill="#a94442"/><text x="385" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1760–62</text><text x="385" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đi sứ</text><text x="385" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">nhà Thanh</text>
<circle cx="490" cy="125" r="10" fill="#a94442"/><text x="490" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1773</text><text x="490" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vân đài</text><text x="490" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">loại ngữ</text><text x="490" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Làm Bồi tụng</text>
<circle cx="595" cy="125" r="10" fill="#a94442"/><text x="595" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1776</text><text x="595" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Phủ biên</text><text x="595" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">tạp lục</text>
<circle cx="700" cy="125" r="10" fill="#333"/><text x="700" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1784</text><text x="700" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mất; bãi triều</text><text x="700" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">ba ngày</text><text x="700" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Truy tặng</text><text x="700" y="84" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thượng thư</text>
<circle cx="810" cy="125" r="10" fill="#a94442"/><text x="810" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2025</text><text x="810" y="178" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">UNESCO</text><text x="810" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">vinh danh</text>
<text x="30" y="228" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Wikipedia "Lê Quý Đôn" + Bảo tàng Lịch sử Quốc gia + Cổng thông tin tỉnh Hưng Yên..</text>
</svg>
