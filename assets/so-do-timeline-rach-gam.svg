<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Sơ đồ dòng thời gian trận Rạch Gầm – Xoài Mút, 1783–1785 và di tích năm 2014">
<title>Dòng thời gian Rạch Gầm – Xoài Mút, 1783–1785 (sơ đồ minh họa được vẽ riêng cho website)</title>
<rect width="900" height="260" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Rạch Gầm – Xoài Mút — dòng thời gian 1783–1785 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="140" x2="840" y2="140" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="100" cy="140" r="10" fill="#a94442"/><text x="100" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2/1783</text><text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nguyễn Ánh thua trận,</text><text x="100" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Châu Văn Tiếp cầu viện Xiêm</text><text x="100" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ba Giồng</text>
<circle cx="250" cy="140" r="10" fill="#a94442"/><text x="250" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">25/7/1784</text><text x="250" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Chiêu Tăng đem 300</text><text x="250" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">thuyền Xiêm sang giúp</text><text x="250" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vịnh Xiêm La</text>
<circle cx="400" cy="140" r="10" fill="#a94442"/><text x="400" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">30/11/1784</text><text x="400" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Châu Văn Tiếp tử trận</text><text x="400" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">ở sông Mân Thít</text><text x="400" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mân Thít</text>
<circle cx="550" cy="140" r="10" fill="#a94442"/><text x="550" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Cuối 1784</text><text x="550" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nguyễn Huệ làm tổng</text><text x="550" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">chỉ huy vào Nam</text><text x="550" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Quy Nhơn – Mỹ Tho</text>
<circle cx="700" cy="140" r="10" fill="#a94442"/><text x="700" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">19 rạng 20/1/1785</text><text x="700" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Trận Rạch Gầm –</text><text x="700" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xoài Mút: Tây Sơn thắng</text><text x="700" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sông Tiền</text>
<circle cx="830" cy="140" r="10" fill="#333"/><text x="830" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">31/12/2014</text><text x="830" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Di tích quốc gia</text><text x="830" y="213" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">đặc biệt</text><text x="830" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Kim Sơn</text>
<text x="30" y="250" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Wikipedia "Trận Rạch Gầm – Xoài Mút" + Cổng TTĐT tỉnh Tiền Giang + tài liệu Đại học Duy Tân. Ngày giờ và quân số các nguồn vênh nhau.</text>
</svg>
