<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Bà Triệu năm 220 đến năm 248">
<title>Dòng thời gian Bà Triệu, năm 220–248</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Bà Triệu — dòng thời gian năm 220–248 (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 220</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đông Hán sụp đổ; Giao Châu thuộc Ngô</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Giao Chỉ, Cửu Chân</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Mùa xuân 248</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nổi dậy, đánh chiếm Tư Phố</text><text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Núi Nưa, Bồ Điền</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 248</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Lục Dận sang; Bồ Điền thất thủ</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 248</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bà Triệu mất; các nguồn vênh nhau</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Đại Việt sử ký toàn thư + Tam quốc chí. Tuổi và thời gian chống đỡ các nguồn vênh nhau.</text>
</svg>
