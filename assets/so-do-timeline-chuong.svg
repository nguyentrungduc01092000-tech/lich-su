<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian làng nón lá Chuông từ năm 791 đến năm 2024">
<title>Dòng thời gian làng nón lá Chuông, 791–2024</title>
<rect width="900" height="240" fill="#fdf6e3"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Làng nón lá Chuông — dòng thời gian (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#8a6d3b"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 791</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Trang Thì Trung làm nón</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo lời các cụ cao niên</text>
<circle cx="360" cy="120" r="10" fill="#8a6d3b"/><text x="360" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Đầu thế kỷ 20</text><text x="360" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ông Hai Cát mang nón Xuân Kiều về làng</text>
<circle cx="600" cy="120" r="10" fill="#8a6d3b"/><text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1959–1960</text><text x="600" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nón bài thơ ra đời ở Huế</text><text x="600" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mốc của Huế, để phân biệt</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 2024</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nón Chuông xuất khẩu</text>
<text x="30" y="230" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Tạp chí Kiến trúc + Dân Việt + Cổng thông tin điện tử Chính phủ. Năm 791 là mốc theo lời kể trong làng, không phải niên đại khảo cổ.</text>
</svg>
