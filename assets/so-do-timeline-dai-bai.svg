<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian làng đúc đồng Đại Bái từ đầu thế kỷ XI tới nay">
<title>Dòng thời gian làng đúc đồng Đại Bái, đầu thế kỷ XI tới nay</title>
<rect width="900" height="240" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Làng đúc đồng Đại Bái — dòng thời gian (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="130" x2="840" y2="130" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="90" cy="130" r="10" fill="#a94442"/><text x="90" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Đầu TK XI*</text><text x="90" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nguyễn Công Truyền</text><text x="90" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">mở lò truyền nghề</text>
<circle cx="225" cy="130" r="10" fill="#a94442"/><text x="225" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1069*</text><text x="225" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tổ nghề mất ngày</text><text x="225" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">29/9 năm Kỷ Dậu</text>
<circle cx="360" cy="130" r="10" fill="#a94442"/><text x="360" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Trước TK XVII</text><text x="360" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Làng mang tên</text><text x="360" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Văn Lãng</text>
<circle cx="495" cy="130" r="10" fill="#333"/><text x="495" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Sau 1945</text><text x="495" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ba xã sáp nhập</text><text x="495" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">thành xã Đại Bái</text>
<circle cx="640" cy="130" r="10" fill="#333"/><text x="640" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 1992</text><text x="640" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đình Diên Lộc</text><text x="640" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">phục dựng</text>
<circle cx="790" cy="130" r="10" fill="#333"/><text x="790" y="105" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 1997</text><text x="790" y="165" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Lăng mộ tổ nghề</text><text x="790" y="183" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">xây tại xứ đồng Lít</text>
<text x="30" y="225" font-family="sans-serif" font-size="12" fill="#777">*Mốc đầu thế kỷ XI và năm 1069 là theo truyền ngôn và thần phả của làng, chưa có biên bản đương thời. Năm vị hậu thiên sư: thế kỷ 15–16 hay thời Nguyễn — các nguồn vênh nhau, xem Bài 19.</text>
</svg>
