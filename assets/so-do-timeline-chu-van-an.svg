<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Chu Văn An năm 1292 đến năm 2019">
<title>Dòng thời gian Chu Văn An, 1292–2019</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Chu Văn An — dòng thời gian 1292–2019 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="100" cy="120" r="10" fill="#a94442"/><text x="100" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1292</text><text x="100" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh tại thôn Văn,</text><text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">xã Thanh Liệt</text><text x="100" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo thần tích</text>
<circle cx="240" cy="120" r="10" fill="#a94442"/><text x="240" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1329</text><text x="240" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Trần Vượng lên ngôi,</text><text x="240" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">tức Hiến Tông</text><text x="240" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thầy của Thái tử</text>
<circle cx="380" cy="120" r="10" fill="#a94442"/><text x="380" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1357</text><text x="380" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Minh Tông mất,</text><text x="380" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Dụ Tông nắm quyền</text>
<circle cx="520" cy="120" r="10" fill="#a94442"/><text x="520" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Sau 1358</text><text x="520" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Dâng Thất trảm sớ,</text><text x="520" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">treo mũ về quê</text><text x="520" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vua không trả lời</text>
<circle cx="660" cy="120" r="10" fill="#333"/><text x="660" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1370</text><text x="660" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mất; truy tặng</text><text x="660" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Văn Trinh công</text><text x="660" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thờ ở Văn Miếu</text>
<circle cx="800" cy="120" r="10" fill="#a94442"/><text x="800" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2019</text><text x="800" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">UNESCO vinh danh</text><text x="800" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">650 năm ngày mất</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Đại Việt sử ký toàn thư + thần tích đình Thanh Liệt + UNESCO 2019. Năm sinh 1292 theo thần tích, không do chính sử ghi.</text>
</svg>
