<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian Mai Thúc Loan năm 670 đến năm 2022">
<title>Dòng thời gian Mai Thúc Loan, năm 670–2022</title>
<rect width="900" height="240" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Mai Thúc Loan — dòng thời gian năm 670–2022 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="125" x2="840" y2="125" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="100" cy="125" r="10" fill="#a94442"/><text x="100" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 670</text><text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh ở châu Hoan</text><text x="100" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ngày sinh chưa rõ</text>
<circle cx="280" cy="125" r="10" fill="#a94442"/><text x="280" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 713 (?)</text><text x="280" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Khởi nghĩa theo truyền thống Việt</text><text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mốc này còn tranh cãi</text>
<circle cx="460" cy="125" r="10" fill="#a94442"/><text x="460" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 722</text><text x="460" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xưng đế, đóng đô Vạn An</text><text x="460" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vạn An thất thủ, khởi nghĩa bị dẹp</text>
<circle cx="640" cy="125" r="10" fill="#333"/><text x="640" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 722–723</text><text x="640" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mai Thúc Loan mất</text><text x="640" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mai Thiếu Đế nối ngôi (tương truyền)</text>
<circle cx="820" cy="125" r="10" fill="#2e7d32"/><text x="820" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 2022</text><text x="820" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Di tích Quốc gia đặc biệt</text><text x="820" y="100" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đền thờ vua Mai, Nam Đàn</text>
<text x="30" y="228" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Cựu Đường thư, Tân Đường thư, Đại Việt sử ký toàn thư, Việt điện u linh tập. Năm bắt đầu và ngày mất các nguồn vênh nhau.</text>
</svg>
