<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Hai Bà Trưng năm 40 đến năm 43">
<title>Dòng thời gian Hai Bà Trưng, năm 40–43</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Hai Bà Trưng — dòng thời gian năm 40–43 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Mùa xuân 40</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nổi binh, đánh quận trị</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hát Môn</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 40</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xưng vương, đóng đô Mê Linh</text><text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">65 thành hưởng ứng</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 42</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nhà Hán sai Mã Viện sang</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 43</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hai Bà mất; Giao Chỉ lại thuộc Hán</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Hậu Hán thư + Đại Việt sử ký toàn thư. Chi tiết cuối cùng các nguồn vênh nhau.</text>
</svg>
