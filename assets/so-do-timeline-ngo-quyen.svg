<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Ngô Quyền năm 897 hoặc 898 đến năm 944">
<title>Dòng thời gian Ngô Quyền, 897/898–944</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Ngô Quyền — dòng thời gian 897/898–944 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="110" cy="120" r="10" fill="#a94442"/><text x="110" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">897 hoặc 898</text><text x="110" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh tại Đường Lâm</text><text x="110" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Con châu mục Ngô Mân</text>
<circle cx="290" cy="120" r="10" fill="#a94442"/><text x="290" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 937</text><text x="290" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Kiều Công Tiễn giết</text><text x="290" y="193" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Dương Đình Nghệ</text><text x="290" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Phong Châu</text>
<circle cx="470" cy="120" r="10" fill="#a94442"/><text x="470" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Cuối đông 938</text><text x="470" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thắng Bạch Đằng</text><text x="470" y="193" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Lưu Hoằng Tháo tử trận</text><text x="470" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sông Bạch Đằng</text>
<circle cx="650" cy="120" r="10" fill="#a94442"/><text x="650" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Mùa xuân 939</text><text x="650" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xưng vương</text><text x="650" y="193" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">đóng đô Cổ Loa</text><text x="650" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Cổ Loa</text>
<circle cx="810" cy="120" r="10" fill="#333"/><text x="810" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 944</text><text x="810" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ngô Quyền mất</text><text x="810" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Cổ Loa</text>
<text x="30" y="212" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Đại Việt sử ký toàn thư + Wikipedia. Năm sinh 897/898 và tuổi thọ các nguồn vênh nhau.</text>
</svg>
