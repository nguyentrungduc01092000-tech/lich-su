<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian Lý Thường Kiệt đánh Tống 1075-1076 và phòng thủ sông Như Nguyệt 1077">
<title>Lý Thường Kiệt — dòng thời gian 1069–1077</title>
<rect width="900" height="240" fill="#eef3f8"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Lý Thường Kiệt — đánh Tống và phòng tuyến sông Như Nguyệt</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#2e5a88" stroke-width="3"/>
<circle cx="130" cy="120" r="10" fill="#2e5a88"/><text x="130" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1069</text><text x="130" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đánh Chiêm Thành</text>
<circle cx="330" cy="120" r="10" fill="#2e5a88"/><text x="330" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">10/1075</text><text x="330" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tiến công sang đất Tống</text><text x="330" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">27/10: Vi Thủ An đánh Cổ Vạn</text><text x="330" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">30/12/1075: chiếm Khâm Châu</text>
<circle cx="550" cy="120" r="10" fill="#2e5a88"/><text x="550" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1/3/1076</text><text x="550" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hạ thành Ung Châu (42 ngày vây)</text>
<circle cx="760" cy="120" r="10" fill="#333"/><text x="760" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1077</text><text x="760" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Phòng tuyến sông Như Nguyệt</text>
<text x="30" y="230" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Bảo tàng Lịch sử Quốc gia + Wikipedia "Chiến dịch đánh Tống 1075–1076". Quân số 10 vạn là con số trong nguồn.</text>
</svg>
