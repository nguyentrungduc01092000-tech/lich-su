<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Lý Bí và nhà Tiền Lý từ năm 541 đến năm 602">
<title>Lý Bí và nhà Tiền Lý — dòng thời gian 541–602</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Lý Bí và nhà Tiền Lý — dòng thời gian 541–602 (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Cuối năm 541</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Dấy binh, chiếm Long Biên</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đuổi Tiêu Tư</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Tháng giêng 544</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xưng đế, quốc hiệu Vạn Xuân</text><text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Niên hiệu Thiên Đức</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Tháng 3 năm 548</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Triệu Việt Vương kế tục</text><text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Giữ đầm Dạ Trạch</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 602</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hậu Lý Nam Đế đầu hàng</text><text x="780" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nhà Tiền Lý kết thúc</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Đại Việt sử ký toàn thư + Wikipedia. Một số mốc các nguồn vênh nhau — xem Bài 7.</text>
</svg>
