<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian làng lụa Vạn Phúc từ khoảng năm 865 đến năm 1958">
<title>Dòng thời gian làng lụa Vạn Phúc, khoảng 865–1958</title>
<rect width="900" height="240" fill="#fdf6e3"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Làng lụa Vạn Phúc — dòng thời gian (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#8a6d3b"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Khoảng 865</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Làng Vạn Bảo hình thành</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo truyền thuyết tổ nghề</text>
<circle cx="360" cy="120" r="10" fill="#8a6d3b"/><text x="360" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Cuối thế kỷ 19</text><text x="360" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đổi tên Vạn Bảo → Vạn Phúc</text><text x="360" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Kiêng húy vua Thành Thái</text>
<circle cx="600" cy="120" r="10" fill="#8a6d3b"/><text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1931</text><text x="600" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hội chợ Marseille</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Từ 1958</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Xuất khẩu lụa</text>
<text x="30" y="230" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Tạp chí Văn hóa Nghệ thuật + Báo Sơn La. Năm 865 là mốc theo truyền thuyết, không phải niên đại khảo cổ.</text>
</svg>
