<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian ba lần chống quân Nguyên 1258, 1285, 1288">
<title>Ba lần chống quân Nguyên — dòng thời gian 1258, 1285, 1288</title>
<rect width="900" height="240" fill="#eef3f8"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Trần Hưng Đạo — ba lần chống quân Nguyên (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#2e5a88" stroke-width="3"/>
<circle cx="150" cy="120" r="10" fill="#2e5a88"/><text x="150" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1258 — Lần 1</text><text x="150" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Rút khỏi Thăng Long, phản công</text><text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đông Bộ Đầu, 29/1/1258</text><text x="150" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Trần Quốc Tuấn tham gia</text>
<circle cx="450" cy="120" r="10" fill="#2e5a88"/><text x="450" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1285 — Lần 2</text><text x="450" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tiết chế; phản công tháng 5</text><text x="450" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hàm Tử, Chương Dương, Tây Kết</text><text x="450" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Hội nghị Diên Hồng</text>
<circle cx="750" cy="120" r="10" fill="#2e5a88"/><text x="750" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1288 — Lần 3</text><text x="750" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tiết chế; Bạch Đằng, tháng 4</text><text x="750" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Cọc ngầm + thủy triều</text>
<text x="30" y="230" font-family="sans-serif" font-size="12" fill="#777">Quân số trong sử liệu là ước lượng, không phải số đã kiểm đếm — xem bảng kiểm chứng nguồn.</text>
</svg>
