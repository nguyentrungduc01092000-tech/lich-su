<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Sơ đồ dòng thời gian Nguyễn Trãi 1380-1464">
<title>Dòng thời gian Nguyễn Trãi, 1380–1464</title>
<rect width="900" height="240" fill="#f3efe8"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Nguyễn Trãi — dòng thời gian 1380–1464</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#5b4636" stroke-width="3"/>
<circle cx="110" cy="120" r="10" fill="#5b4636"/><text x="110" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1380</text><text x="110" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh ra</text>
<circle cx="280" cy="120" r="10" fill="#5b4636"/><text x="280" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1400</text><text x="280" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đỗ Thái học sinh</text>
<circle cx="430" cy="120" r="10" fill="#5b4636"/><text x="430" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1418</text><text x="430" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vào Lam Sơn</text><text x="430" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">1407: tiễn cha ở ải Nam Quan</text>
<circle cx="580" cy="120" r="10" fill="#5b4636"/><text x="580" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1428</text><text x="580" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bình Ngô đại cáo</text>
<circle cx="720" cy="120" r="10" fill="#333"/><text x="720" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1442</text><text x="720" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Vụ án Lệ Chi Viên</text><text x="720" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">1464: minh oan</text>
<text x="30" y="230" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Vietpedia + Wikipedia "Bình Ngô đại cáo" và "Vụ án Lệ Chi viên". Nguyên nhân vua Lê Thái Tông chết tới nay vẫn không rõ.</text>
</svg>
