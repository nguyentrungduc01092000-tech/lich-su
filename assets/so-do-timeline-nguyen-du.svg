<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Nguyễn Du từ năm 1765 đến năm 2012">
<title>Dòng thời gian Nguyễn Du, 1765–2012</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Nguyễn Du — dòng thời gian 1765–2012 (sơ đồ minh họa được vẽ riêng cho website)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1765</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Sinh; quê Tiên Điền, Hà Tĩnh</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Con Tể tướng Nguyễn Nghiễm</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1813–1814</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đi sứ sang nhà Thanh</text><text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mang về Bắc hành tạp lục</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1820</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mất tại Huế, thọ 55 tuổi</text><text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Truyện Kiều: 3.254 câu lục bát</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2012</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Khu lưu niệm: Di tích Quốc gia</text><text x="780" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">đặc biệt (UNESCO 2013)</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Bộ VHTTDL + Wikipedia tiếng Việt. Năm sinh, năm sáng tác các nguồn vênh nhau.</text>
</svg>
