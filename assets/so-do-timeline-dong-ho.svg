<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian nghề làm tranh Đông Hồ từ khoảng 500 năm trước đến ngày UNESCO ghi danh 9 tháng 12 năm 2025">
<title>Dòng thời gian nghề làm tranh Đông Hồ (sơ đồ minh họa tự vẽ)</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Nghề làm tranh Đông Hồ — dòng thời gian (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Khoảng 500 năm trước</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nghề ra đời tại làng Đông Hồ</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo hồ sơ UNESCO</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">27/12/2012</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Di sản văn hóa phi vật thể quốc gia</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Năm 2023</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Khánh thành Trung tâm Bảo tồn</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">9/12/2025</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">UNESCO ghi danh cần bảo vệ khẩn cấp</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: hồ sơ đề cử UNESCO + Wikipedia. Mốc di sản quốc gia 2012/2013 các nguồn vênh nhau — xem Bài 12.</text>
</svg>
