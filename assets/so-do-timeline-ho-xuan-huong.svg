<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Sơ đồ dòng thời gian Hồ Xuân Hương từ năm 1772 đến năm 2021">
<title>Dòng thời gian Hồ Xuân Hương, 1772–2021</title>
<rect width="900" height="220" fill="#fdf8ee"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Hồ Xuân Hương — dòng thời gian 1772–2021</text>
<line x1="60" y1="120" x2="840" y2="120" stroke="#8a6d3b" stroke-width="3"/>
<circle cx="120" cy="120" r="10" fill="#a94442"/><text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1772</text><text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Năm sinh được dùng chung</text><text x="120" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ngày tháng cụ thể chưa rõ</text>
<circle cx="340" cy="120" r="10" fill="#a94442"/><text x="340" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1822</text><text x="340" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Năm mất được dùng chung</text><text x="340" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Ngày tháng cụ thể chưa rõ</text>
<circle cx="560" cy="120" r="10" fill="#a94442"/><text x="560" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1916</text><text x="560" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Giai nhân di mặc ấn hành</text><text x="560" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Lần đầu hậu thế biết tới bà</text>
<circle cx="780" cy="120" r="10" fill="#333"/><text x="780" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2021</text><text x="780" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">UNESCO vinh danh</text><text x="780" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">250 năm ngày sinh, 200 năm ngày mất</text>
<text x="30" y="210" font-family="sans-serif" font-size="12" fill="#777">Nguồn: Wikipedia tiếng Việt + Cổng thông tin tỉnh Nghệ An. Năm sinh, năm mất chỉ dùng mốc năm.</text>
</svg>
