<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Sơ đồ dòng thời gian Trần Bình Trọng 1259–1285">
<title>Trần Bình Trọng — dòng thời gian 1259–1285</title>
<rect width="900" height="280" fill="#eef3f8"/>
<text x="30" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#333">Trần Bình Trọng — dòng thời gian 1259–1285 (sơ đồ minh họa tự vẽ)</text>
<line x1="60" y1="140" x2="840" y2="140" stroke="#2e5a88" stroke-width="3"/>
<circle cx="100" cy="140" r="10" fill="#2e5a88"/><text x="100" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1259 — Sinh ra</text><text x="100" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Theo nguồn tổng hợp;</text><text x="100" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Toàn thư không ghi năm sinh</text><text x="100" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Họ Lê, dòng dõi Lê Đại Hành</text>
<circle cx="240" cy="140" r="10" fill="#2e5a88"/><text x="240" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">8/1284 — Bình Than</text><text x="240" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Đem quân đóng đồn</text><text x="240" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">ở sông Bình Than</text><text x="240" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Tước Bảo Nghĩa hầu</text>
<circle cx="380" cy="140" r="10" fill="#2e5a88"/><text x="380" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">12/1284 — Quân Nguyên sang</text><text x="380" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thoát Hoan chỉ huy</text><text x="380" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">lần đánh thứ hai</text><text x="380" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Thăng Long thất thủ</text>
<circle cx="520" cy="140" r="10" fill="#2e5a88"/><text x="520" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Đầu 1285 — Giữ Thiên Trường</text><text x="520" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Chặn quân truy đuổi</text><text x="520" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">để vua tôi rút lui</text><text x="520" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Nhiệm vụ chặn hậu</text>
<circle cx="660" cy="140" r="10" fill="#8a2f2f"/><text x="660" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">2/1285 — Thiên Mạc</text><text x="660" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bị bắt ở bãi Thiên Mạc,</text><text x="660" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">từ chối hàng, bị giết</text><text x="660" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">“Thà làm quỷ nước Nam”</text>
<circle cx="800" cy="140" r="10" fill="#2e5a88"/><text x="800" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">1285 — Truy phong</text><text x="800" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bảo Nghĩa vương;</text><text x="800" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">vua tôi thương tiếc</text><text x="800" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Mất năm 26 tuổi</text>
<text x="30" y="265" font-family="sans-serif" font-size="12" fill="#777">Ngày mất: Toàn thư chép tháng 2 âm lịch 1285; An Nam chí lược chép ngày Nhâm Thìn tháng Giêng — hai cách chép chưa thống nhất, xem Bài 16 và bảng kiểm chứng nguồn.</text>
</svg>
